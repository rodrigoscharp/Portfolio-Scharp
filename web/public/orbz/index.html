<body>

<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const V3 = THREE.Vector3;
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const floorY = (Y, f, k = 0.3) => Y < f ? f + (Y - f) * k : Y;
const ease = x => x * x * (3 - 2 * x);

// ---------- shared textures ----------
const FS = 512, fc = document.createElement('canvas'); fc.width = fc.height = FS;
{ const c = fc.getContext('2d'), im = c.createImageData(FS, FS);
  for (let i = 0; i < im.data.length; i += 4) im.data[i + 3] = 255;
  for (let k = 0; k < FS * FS * 0.62; k++) { const x = Math.random() * FS | 0, y = Math.random() * FS | 0, v = Math.pow(Math.random(), 0.6) * 255 | 0, i = (y * FS + x) * 4; if (im.data[i] < v) im.data[i] = im.data[i + 1] = im.data[i + 2] = v; }
  c.putImageData(im, 0, 0); }
const furTex = new THREE.CanvasTexture(fc);
furTex.wrapS = furTex.wrapT = THREE.RepeatWrapping; furTex.repeat.set(7, 5);
furTex.generateMipmaps = false; furTex.minFilter = furTex.magFilter = THREE.LinearFilter;
const SHELLS = 12;
// Portfolio embed: a smooth plush body instead of 12 alpha-tested fur shells.
// One mesh per Orb, no transparency sorting, no aliasing on weak GPUs.
const SMOOTH = true;

const mWhite = new THREE.MeshPhysicalMaterial({ name: 'olho_branco', color: 0xFBFBF8, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.04 });
const mPupil = new THREE.MeshPhysicalMaterial({ name: 'pupila', color: 0x111010, roughness: 0.15, clearcoat: 1 });
const mShine = new THREE.MeshBasicMaterial({ name: 'brilho', color: 0xffffff });
const mLens = new THREE.MeshPhysicalMaterial({ name: 'lente', color: 0xffffff, roughness: 0, transparent: true, opacity: 0.2 });
const mVisor = new THREE.MeshPhysicalMaterial({ name: 'viseira', color: 0x2FB27A, roughness: 0.15, transparent: true, opacity: 0.6, clearcoat: 1 });
const mInk = new THREE.MeshStandardMaterial({ name: 'tinta', color: 0x2D2A26, roughness: 0.5 });
const mOrange = new THREE.MeshPhysicalMaterial({ name: 'laranja', color: 0xFF6B2C, roughness: 0.35, clearcoat: 0.6 });
const mTear = new THREE.MeshPhysicalMaterial({ name: 'lagrima', color: 0x7FB8FF, roughness: 0.05, transparent: true, opacity: 0.85, clearcoat: 1 });
const mSpark = new THREE.MeshStandardMaterial({ name: 'brilhinho', color: 0xFFD25E, emissive: 0xFFC23A, emissiveIntensity: 0.6, roughness: 0.4 });
const mGold = new THREE.MeshPhysicalMaterial({ name: 'ouro', color: 0xE8B64A, metalness: 0.85, roughness: 0.25, clearcoat: 0.5 });
const mGlow = new THREE.MeshStandardMaterial({ name: 'antena_luz', color: 0xFFB23A, emissive: 0xFF8A1F, emissiveIntensity: 0.6, roughness: 0.3 });
const mClockFace = new THREE.MeshStandardMaterial({ name: 'relogio_mostrador', color: 0xFFFBF2, roughness: 0.6 });
const mCode = new THREE.MeshStandardMaterial({ name: 'codigo_brilho', color: 0xFF9A66, emissive: 0xE86A33, emissiveIntensity: 0.8, roughness: 0.35 });
const mScreen = new THREE.MeshStandardMaterial({ name: 'tela', color: 0x2A160E, emissive: 0x7A3416, emissiveIntensity: 0.9, roughness: 0.2 });
const mAlu = new THREE.MeshPhysicalMaterial({ name: 'aluminio_preto', color: 0x1B1C1F, metalness: 0.6, roughness: 0.32, clearcoat: 0.5, clearcoatRoughness: 0.2 });
const mPear = new THREE.MeshPhysicalMaterial({ name: 'logo_pera', color: 0xB4B7BD, metalness: 0.7, roughness: 0.25, clearcoat: 0.6, emissive: 0x2A2B2E, emissiveIntensity: 0.6 });
const mBezel = new THREE.MeshStandardMaterial({ name: 'moldura', color: 0x111214, roughness: 0.3 });
const mPaper = new THREE.MeshStandardMaterial({ name: 'envelope', color: 0xFFFFFF, roughness: 0.7 });
const mBubble = new THREE.MeshPhysicalMaterial({ name: 'balao', color: 0xFFFFFF, roughness: 0.45, clearcoat: 0.3 });
const mCheck = new THREE.MeshStandardMaterial({ name: 'ok', color: 0x34B86A, roughness: 0.4 });
const mFlap = new THREE.MeshStandardMaterial({ name: 'aba', color: 0xEDE6D8, roughness: 0.7 });

const PAL = {
  laranja: { label: 'Laranja', fur: 0xEE7A3C, acc: 0x2D2A26, acc2: 0xFFD25E },
  lilas:   { label: 'Lilás',   fur: 0xA68CEB, acc: 0x2D2A26, acc2: 0xFFD25E },
  amarelo: { label: 'Amarelo', fur: 0xF5C443, acc: 0xD8402B, acc2: 0x2D2A26 },
  azul:    { label: 'Azul',    fur: 0x5B8FE0, acc: 0xFF7A45, acc2: 0xFFE7C9 },
  rosa:    { label: 'Rosa',    fur: 0xF39AB4, acc: 0x3B5BD9, acc2: 0xFFFFFF },
  verde:   { label: 'Limão',   fur: 0xA9D35A, acc: 0x7B4BD6, acc2: 0xFFFFFF },
  claude:  { label: 'Terracota', fur: 0xD97757, acc: 0x2D2A26, acc2: 0xF3E9D8 },
  menta:   { label: 'Menta',   fur: 0x6CCBB0, acc: 0x2D2A26, acc2: 0xFF7A45 },
  cinza:   { label: 'Grafite', fur: 0x5A5753, acc: 0xFF7A45, acc2: 0xF3E9D8 }
};
const SHAPES = {
  pilula: (x, y, z) => [x * 0.74, floorY(y * 1.38, -1.22, 0.25), z * 0.74],
  mochi:  (x, y, z) => { const Y = y > 0 ? y * 0.82 : y * 0.5, k = 1 + 0.05 * (1 - y * y); return [x * 1.3 * k, floorY(Y, -0.4, 0.2), z * 1.02 * k]; },
  cubo:   (x, y, z) => { const n = 4.5, k = 0.9 / Math.pow(Math.abs(x) ** n + Math.abs(y) ** n + Math.abs(z) ** n, 1 / n); return [x * k, floorY(y * k, -0.86, 0.2), z * k]; },
  gota:   (x, y, z) => { const Y0 = y * 1.3, k = 1 - 0.6 * sstep(-0.9, 1.3, Y0); return [x * k * 1.08, floorY(Y0, -1.14, 0.25), z * k * 1.08]; },
  bolinha: (x, y, z) => [x, floorY(y, -0.8), z],
  ovinho:  (x, y, z) => { const k = 1 - 0.14 * y; return [x * k * 0.92, floorY(y * 1.2, -0.98), z * k * 0.92]; },
  cubinho: (x, y, z) => { const n = 3.6, k = 1 / Math.pow(Math.abs(x) ** n + Math.abs(y) ** n + Math.abs(z) ** n, 1 / n) * 0.88; return [x * k, floorY(y * k * 1.06, -0.88, 0.2), z * k * 0.95]; },
  pudim:   (x, y, z) => { const k = 1.1 - 0.26 * sstep(-0.7, 1, y); return [x * k, floorY(y * 1.06, -0.72, 0.15), z * k * 0.96]; }
};
const EMOS = { neutro: 'Neutro', feliz: 'Feliz', triste: 'Triste', bravo: 'Bravo', surpreso: 'Surpreso', pensando: 'Pensando', dormindo: 'Dormindo' };
const EK = Object.keys(EMOS);

const TEAM = [
  { name: 'Beto',  role: 'Coordinator', shape: 'bolinha', pal: 'menta', fur: 0.13, droop: 0.035, eye: { x: 0.3, y: 0.2, s: 1 }, acc: 'fone', x: -6.2 },
  { name: 'Lume',  role: 'Research',    shape: 'ovinho',  pal: 'lilas',   fur: 0.13, droop: 0.035, eye: { x: 0.27, y: 0.35, s: 1 }, acc: 'oculos1', x: -3.1 },
  { name: 'Cifra', role: 'Finance',    shape: 'cubinho', pal: 'verde',   fur: 0.13, droop: 0.035, eye: { x: 0.3, y: 0.2, s: 1.12 }, acc: 'gravata', x: 0 },
  { name: 'Tico',  role: 'Calendar',      shape: 'pudim',   pal: 'azul',    fur: 0.13, droop: 0.035, eye: { x: 0.31, y: 0.24, s: 1.1 }, acc: 'antena', x: 3.1 },
  { name: 'Bit',   role: 'Code',      shape: 'pilula',  pal: 'claude',   fur: 0.11, droop: 0.03, eye: { x: 0.25, y: 0.52, s: 0.95 }, acc: 'codigo', x: 6.2 }
];
const SAVE_KEY = 'time-do-beto-v3';
if (false) try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (Array.isArray(s)) s.forEach((v, i) => { if (TEAM[i]) ['name', 'role', 'pal'].forEach(k => { if (v[k] != null) TEAM[i][k] = v[k]; }); }); } catch {}
const save = () => {};

// ---------- scene ----------
const team = new THREE.Group(); team.name = 'time';
const platMat = new THREE.MeshPhysicalMaterial({ name: 'palco', color: 0xEADFCF, roughness: 1, sheen: 1, sheenRoughness: 0.6, sheenColor: new THREE.Color(0xFFFFFF) });
const plat = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.2, 96), platMat); plat.name = 'palco';
plat.scale.set(7.75, 1, 1.75); plat.position.y = -0.1; plat.receiveShadow = true; team.add(plat);
const platRim = new THREE.Mesh(new THREE.TorusGeometry(1, 0.1, 16, 128), platMat); platRim.name = 'palco_borda';
platRim.rotation.x = Math.PI / 2; platRim.scale.set(7.75, 1.75, 1); platRim.position.y = -0.1; platRim.receiveShadow = true; team.add(platRim);
// Portfolio embed: no platform, the Orbz float over a soft shadow.
plat.visible = false; platRim.visible = false;

const zShape = new THREE.Shape();
zShape.moveTo(-0.5, 0.5); zShape.lineTo(0.5, 0.5); zShape.lineTo(0.5, 0.3); zShape.lineTo(-0.15, -0.3); zShape.lineTo(0.5, -0.3); zShape.lineTo(0.5, -0.5);
zShape.lineTo(-0.5, -0.5); zShape.lineTo(-0.5, -0.3); zShape.lineTo(0.15, 0.3); zShape.lineTo(-0.5, 0.3); zShape.closePath();
const zGeo = new THREE.ExtrudeGeometry(zShape, { depth: 0.25, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 3 }); zGeo.center();

function makeFurMat() {
  const m = new THREE.MeshStandardMaterial({ name: 'pelo', alphaMap: furTex, alphaTest: 0.5, roughness: 1 });
  m.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float shell;\nvarying float vShell;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvShell = shell;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vShell;')
      .replace('#include <color_fragment>', `#include <color_fragment>\ndiffuseColor.rgb *= 0.5 + 0.62 * pow(vShell / ${(SHELLS - 1).toFixed(1)}, 0.7);`)
      .replace('#include <alphatest_fragment>', `if (diffuseColor.a < 0.04 + (vShell / ${SHELLS.toFixed(1)}) * 0.9) discard;`);
  };
  m.customProgramCacheKey = () => 'fur-shell-' + SHELLS;
  return m;
}
function makeMesh(name, geo, mat, cast = true) { const m = new THREE.Mesh(geo, mat); m.name = name; m.castShadow = cast; m.receiveShadow = true; return m; }

const agents = TEAM.map((cfg, i) => {
  const root = new THREE.Group(); root.name = 'agente_' + cfg.name; root.position.x = cfg.x; team.add(root);
  const mats = {
    base: SMOOTH
      ? new THREE.MeshPhysicalMaterial({ name: 'pelucia', roughness: 0.9, sheen: 0.6, sheenRoughness: 0.8 })
      : new THREE.MeshStandardMaterial({ name: 'pelo_base', roughness: 1 }),
    fur: makeFurMat(),
    tuft: new THREE.MeshStandardMaterial({ name: 'topete', roughness: 1 }),
    lidLine: new THREE.MeshStandardMaterial({ name: 'palpebra_linha', roughness: 0.8 }),
    acc: new THREE.MeshPhysicalMaterial({ name: 'acessorio', roughness: 0.4, clearcoat: 0.5 }),
    acc2: new THREE.MeshStandardMaterial({ name: 'acessorio2', roughness: 0.8 }),
    led: new THREE.MeshStandardMaterial({ name: 'led', color: 0x4BE08A, emissive: 0x4BE08A, emissiveIntensity: 0.5 }),
    dot: new THREE.MeshStandardMaterial({ name: 'balao_ponto', roughness: 0.5 })
  };
  const st = { lookX: 0, lookY: 0, squashT: -1, blinkT: 1 + Math.random() * 3, phase: Math.random() * 6, w: Object.fromEntries(EK.map(k => [k, k === (cfg.emo || 'neutro') ? 1 : 0])),
    hop: null, nextHappyHop: 1, lean: 0, tmpEmo: null, tmpT: 0, talk: false, lastRed: -1, prevEff: cfg.emo || 'neutro', lr: 0, ly: 0 };
  cfg.emo = cfg.emo || 'neutro';
  return { cfg, root, mats, st, rig: null, head: new V3() };
});

function applyPalette(a, red = 0) {
  const p = PAL[a.cfg.pal] || PAL.laranja, base = new THREE.Color(p.fur).lerp(new THREE.Color(0xE0453A), red * 0.6);
  a.mats.base.color.copy(base).multiplyScalar(SMOOTH ? 0.92 : 0.42);
  // Sheen in the Orb's own color: a white sheen draws a pale outline on the silhouette.
  if (SMOOTH) a.mats.base.sheenColor.copy(base);
  a.mats.fur.color.copy(base); a.mats.tuft.color.copy(base).multiplyScalar(1.05);
  a.mats.lidLine.color.copy(base).multiplyScalar(0.28);
  a.mats.acc.color.set(p.acc); a.mats.acc2.color.set(p.acc2); a.mats.dot.color.set(p.fur);
}

function buildAgent(a) {
  const C = a.cfg, F = SHAPES[C.shape], FUR = C.fur, M = a.mats;
  const geo = new THREE.SphereGeometry(1, 72, 56), p = geo.attributes.position;
  // The sphere's UV seam sits at -X, on a visible side; turn it to face the back.
  if (SMOOTH) geo.rotateY(-Math.PI / 2);
  for (let i = 0; i < p.count; i++) { const r = F(p.getX(i), p.getY(i), p.getZ(i)); p.setXYZ(i, r[0], r[1], r[2]); }
  geo.computeVertexNormals(); geo.computeBoundingBox();
  const minY = geo.boundingBox.min.y;
  const tmp = new THREE.Mesh(geo); tmp.updateMatrixWorld(true);
  const ray = new THREE.Raycaster();
  const hit = (o, d) => { ray.set(o, d); const h = ray.intersectObject(tmp)[0]; return { p: h.point.clone(), n: h.face.normal.clone().normalize() }; };
  const front = (x, y) => hit(new V3(x, y, 5), new V3(0, 0, -1));
  const side = y => hit(new V3(5, y, 0), new V3(-1, 0, 0));
  const topY = hit(new V3(0, 5, 0), new V3(0, -1, 0)).p.y;

  const pivot = new THREE.Group(); pivot.name = 'pivo'; a.root.add(pivot);
  const bodyG = new THREE.Group(); bodyG.name = 'corpo'; bodyG.position.y = -minY; pivot.add(bodyG);
  const nrm = geo.attributes.normal;
  let bodyGeo = geo;
  if (SMOOTH) {
    // Puff the body out to where the fur used to end, so eyes and accessories still sit on it.
    // The sphere's UV seam duplicates vertices, so their normals differ and the light
    // draws a vertical line on the side. Average normals per position to weld it.
    bodyGeo = geo.clone(); const bp = bodyGeo.attributes.position, d = FUR * 0.55;
    const weld = g => {
      const P = g.attributes.position, N = g.attributes.normal, acc = new Map(), key = i => `${P.getX(i).toFixed(4)},${P.getY(i).toFixed(4)},${P.getZ(i).toFixed(4)}`;
      for (let i = 0; i < P.count; i++) { const k = key(i), v = acc.get(k) || [0, 0, 0]; v[0] += N.getX(i); v[1] += N.getY(i); v[2] += N.getZ(i); acc.set(k, v); }
      for (let i = 0; i < P.count; i++) { const v = acc.get(key(i)), l = Math.hypot(v[0], v[1], v[2]) || 1; N.setXYZ(i, v[0] / l, v[1] / l, v[2] / l); }
      N.needsUpdate = true;
    };
    weld(bodyGeo);
    const bn = bodyGeo.attributes.normal;
    for (let i = 0; i < bp.count; i++) bp.setXYZ(i, bp.getX(i) + bn.getX(i) * d, bp.getY(i) + bn.getY(i) * d, bp.getZ(i) + bn.getZ(i) * d);
    bodyGeo.computeVertexNormals(); weld(bodyGeo);
  }
  const body = makeMesh('corpo', bodyGeo, M.base); bodyG.add(body);
  // A smooth body shadowing itself shows a thin dark line along the terminator; the floor shadow stays.
  if (SMOOTH) body.receiveShadow = false;
  if (!SMOOTH) {
    const vc = geo.attributes.position.count, ix = geo.index.array, ic = ix.length, P = geo.attributes.position.array, Nn = nrm.array, UV = geo.attributes.uv.array;
    const pos = new Float32Array(vc * 3 * SHELLS), nor = new Float32Array(vc * 3 * SHELLS), uvs = new Float32Array(vc * 2 * SHELLS), shl = new Float32Array(vc * SHELLS);
    const idx = new (vc * SHELLS > 65535 ? Uint32Array : Uint16Array)(ic * SHELLS);
